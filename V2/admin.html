<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1A2F5A">
  <title>Administração — Domingos da Cunha 4</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#1A2F5A;--blue:#2563EB;--blue-lt:#EFF6FF;--bg:#F5F7FA;--card:#fff;--text:#111827;--muted:#6B7280;--border:#E5E7EB;--shadow:0 1px 8px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.05)}
    html,body{min-height:100%;background:linear-gradient(180deg,#EEF4FF 0%,var(--bg) 56%);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
    .app{min-height:100vh;max-width:430px;margin:0 auto;padding:28px 18px 40px}.hero{text-align:center;padding:18px 8px 22px}.icon{width:88px;height:88px;border-radius:26px;background:var(--navy);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 8px 32px rgba(26,47,90,.28)}h1{font-size:26px;line-height:1.15;color:var(--navy)}p{color:var(--muted);font-size:14px;line-height:1.45;margin-top:7px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}.card:active{transform:scale(.99)}.cicon{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}.title{font-size:15px;font-weight:800;color:var(--navy)}.desc{font-size:12px;color:var(--muted);margin-top:3px}.chev{margin-left:auto;color:#CBD5E1;font-size:24px}.back{display:flex;align-items:center;justify-content:center;width:100%;padding:15px;border-radius:14px;background:#fff;border:1.5px solid var(--border);color:var(--text);font-weight:800;text-decoration:none;margin-top:16px}
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="icon">🛠️</div>
      <h1>Área de administração</h1>
      <p>Escolha o módulo que pretende gerir.</p>
    </section>

    <a class="card" href="garagem-admin.html">
      <div class="cicon" style="background:#EFF6FF">🔐</div>
      <div><div class="title">Acessos e códigos</div><div class="desc">Aprovar utilizadores, gerir PINs e código do quadro elétrico.</div></div>
      <div class="chev">›</div>
    </a>

    <a class="card" href="../backoffice.html">
      <div class="cicon" style="background:#FEE2E2">🧯</div>
      <div><div class="title">Validação dos extintores</div><div class="desc">Validar reportes pendentes, consultar fotos e fechar ocorrências.</div></div>
      <div class="chev">›</div>
    </a>

    <a class="back" href="index.html">← Voltar à app</a>
  </main>
</body>
</html>
