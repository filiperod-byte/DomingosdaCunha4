<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1A2F5A">
  <title>Administração — Domingos da Cunha 4</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}:root{--navy:#1A2F5A;--blue:#2563EB;--blue-lt:#EFF6FF;--bg:#F5F7FA;--card:#fff;--text:#111827;--muted:#6B7280;--border:#E5E7EB;--danger:#DC2626;--shadow:0 1px 8px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.05)}html,body{min-height:100%;background:linear-gradient(180deg,#EEF4FF 0%,var(--bg) 56%);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}.app{min-height:100vh;max-width:430px;margin:0 auto;padding:28px 18px 40px}.hero{text-align:center;padding:18px 8px 22px}.icon{width:88px;height:88px;border-radius:26px;background:var(--navy);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 8px 32px rgba(26,47,90,.28)}h1{font-size:26px;line-height:1.15;color:var(--navy)}p{color:var(--muted);font-size:14px;line-height:1.45;margin-top:7px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}.card:active{transform:scale(.99)}.cicon{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}.title{font-size:15px;font-weight:800;color:var(--navy)}.desc{font-size:12px;color:var(--muted);margin-top:3px}.chev{margin-left:auto;color:#CBD5E1;font-size:24px}.back,.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:15px;border-radius:14px;background:#fff;border:1.5px solid var(--border);color:var(--text);font-weight:800;text-decoration:none;margin-top:10px;font:inherit}.btn-primary{background:var(--blue);color:#fff;border:0}.login{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-top:10px}.field{margin-top:12px}.field label{display:block;font-size:13px;font-weight:800;color:var(--navy);margin-bottom:6px}.input{width:100%;padding:14px;border:1.5px solid var(--border);border-radius:14px;background:#fff;font:inherit}.msg{padding:12px;border-radius:13px;margin-top:10px;font-size:14px;font-weight:700;background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="app">
    <section class="hero"><div class="icon">🛠️</div><h1>Área de administração</h1><p id="lead">Faça login uma vez e escolha o módulo que pretende gerir.</p></section>
    <section id="loginBox" class="login"><div class="field"><label>Email</label><input class="input" id="email" type="email" placeholder="admin@email.com"></div><div class="field"><label>PIN de administrador</label><input class="input" id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"></div><div id="msg"></div><button class="btn btn-primary" onclick="login()">Entrar na administração</button></section>
    <section id="menuBox" class="hidden"><a class="card" href="acessos-admin.html"><div class="cicon" style="background:#EFF6FF">🔐</div><div><div class="title">Acessos e códigos</div><div class="desc">Aprovar utilizadores, gerir PINs e código do quadro elétrico.</div></div><div class="chev">›</div></a><a class="card" href="../backoffice.html"><div class="cicon" style="background:#FEE2E2">🧯</div><div><div class="title">Validação dos extintores</div><div class="desc">Validar reportes pendentes, consultar fotos e fechar ocorrências.</div></div><div class="chev">›</div></a><button class="back" onclick="logout()">Terminar sessão de administração</button></section>
    <a class="back" href="index.html">← Voltar à app</a>
  </main>
<script>
let BACKEND_URL='';
async function init(){const r=await fetch('config.json',{cache:'no-store'});const c=await r.json();BACKEND_URL=c.backendUrl||'';document.getElementById('email').value=sessionStorage.getItem('dc4_admin_email')||c.adminEmail||'';if(sessionStorage.getItem('dc4_admin_unlocked')==='1')showMenu()}
function showMenu(){document.getElementById('loginBox').classList.add('hidden');document.getElementById('menuBox').classList.remove('hidden');document.getElementById('lead').textContent='Sessão de administração ativa.';sessionStorage.setItem('extintores_bo_unlocked','1')}
async function login(){const email=document.getElementById('email').value.trim();const pin=document.getElementById('pin').value.trim();const msg=document.getElementById('msg');msg.innerHTML='';try{const res=await fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'garage.loginAdmin',email,pin})});const r=await res.json();if(r.ok||r.success){sessionStorage.setItem('dc4_admin_unlocked','1');sessionStorage.setItem('dc4_admin_email',email);sessionStorage.setItem('extintores_bo_unlocked','1');showMenu()}else msg.innerHTML='<div class="msg">Credenciais inválidas.</div>'}catch(e){msg.innerHTML='<div class="msg">Erro de ligação ao backend.</div>'}}
function logout(){sessionStorage.removeItem('dc4_admin_unlocked');sessionStorage.removeItem('dc4_admin_email');sessionStorage.removeItem('extintores_bo_unlocked');location.reload()}
init();
</script>
</body>
</html>
