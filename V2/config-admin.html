<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1A2F5A">
  <title>Configurações gerais</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}:root{--navy:#1A2F5A;--blue:#2563EB;--blue-lt:#EFF6FF;--bg:#F5F7FA;--card:#fff;--text:#111827;--muted:#6B7280;--border:#E5E7EB;--danger:#DC2626;--warning:#D97706;--shadow:0 1px 8px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.05)}
    html,body{min-height:100%;background:linear-gradient(180deg,#EEF4FF 0%,var(--bg) 56%);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}.app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:38px}.top{background:var(--navy);color:#fff;padding:22px 20px 44px;border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(26,47,90,.16)}.top-row{display:flex;align-items:flex-start;gap:12px}.back{width:40px;height:40px;border:0;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;font-weight:900;text-decoration:none;display:flex;align-items:center;justify-content:center;flex-shrink:0}.top h1{font-size:24px;line-height:1.12;font-weight:900}.sub{color:rgba(255,255,255,.74);font-size:13px;margin-top:5px;line-height:1.45}.intro{margin:-22px 16px 16px;background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}.intro-icon{width:54px;height:54px;border-radius:17px;background:#FFFBEB;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}.intro-title{font-size:15px;font-weight:900;color:var(--navy)}.intro-text{font-size:12px;color:var(--muted);line-height:1.42;margin-top:3px}.body{padding:0 16px 28px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px}.name{font-size:15px;font-weight:900;color:var(--navy);display:flex;gap:8px;align-items:center}.meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}.field{margin-top:12px}.field label{display:block;font-size:13px;font-weight:900;color:var(--navy);margin-bottom:6px}.input{width:100%;padding:14px;border:1.5px solid var(--border);border-radius:14px;background:#fff;font:inherit}.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.10)}.btn{border:0;border-radius:13px;padding:13px;font-weight:900;cursor:pointer;font:inherit;text-decoration:none;display:flex;width:100%;align-items:center;justify-content:center;margin-top:10px}.btn-primary{background:var(--blue);color:#fff}.btn-warning{background:#FEF3C7;color:#92400E}.btn-danger{background:#FEE2E2;color:#991B1B}.msg{padding:12px;border-radius:13px;margin:10px 0;font-size:13px;font-weight:800;line-height:1.4}.ok{background:#F0FDF4;color:#166534;border:1px solid #BBF7D0}.err{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:13px 18px;border-radius:13px;box-shadow:var(--shadow);opacity:0;transition:.25s;max-width:90vw;text-align:center;z-index:20}.toast.show{opacity:1}
  </style>
</head>
<body><div class="app"><section class="top"><div class="top-row"><a class="back" href="admin.html">←</a><div><h1>Configurações gerais</h1><div class="sub">Dados gerais da app e acesso da administração.</div></div></div></section><section class="intro"><div class="intro-icon">⚙️</div><div><div class="intro-title">Configuração da app</div><div class="intro-text">Estas opções são globais e não pertencem ao módulo do código do quadro elétrico.</div></div></section><main class="body"><div class="card"><div class="name">🏢 Dados do condomínio</div><div class="field"><label>Nome do condomínio</label><input class="input" id="cfg-nome"></div><div class="field"><label>Email do administrador</label><input class="input" id="cfg-admin-email" type="email"></div><div id="cfg-msg"></div><button class="btn btn-primary" onclick="guardarConfigs()">Guardar configurações</button></div><div class="card"><div class="name">🔑 PIN de administrador</div><div class="meta">Este PIN é usado para entrar na área de administração.</div><div class="field"><label>Novo PIN</label><input class="input" id="cfg-admin-pin" type="password" inputmode="numeric" maxlength="6"></div><div id="pin-msg"></div><button class="btn btn-warning" onclick="guardarPinAdmin()">Alterar PIN</button></div><button class="btn btn-danger" onclick="logout()">Terminar sessão de administração</button></main></div><div id="toast" class="toast"></div>
<script>
let BACKEND_URL='',ADMIN_EMAIL='';function authed(){return sessionStorage.getItem('dc4_admin_unlocked')==='1'}function logout(){sessionStorage.removeItem('dc4_admin_unlocked');sessionStorage.removeItem('dc4_admin_email');sessionStorage.removeItem('extintores_bo_unlocked');location.href='admin.html'}async function loadConfig(){const r=await fetch('config.json',{cache:'no-store'});const c=await r.json();BACKEND_URL=c.backendUrl;ADMIN_EMAIL=sessionStorage.getItem('dc4_admin_email')||c.adminEmail||''}async function apiGet(action){const u=new URL(BACKEND_URL);u.searchParams.set('action',action);const r=await fetch(u,{cache:'no-store'});return r.json()}async function apiPost(action,data={}){const r=await fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},data))});return r.json()}function setMsg(id,type,text){document.getElementById(id).innerHTML='<div class="msg '+type+'">'+escapeHtml(text)+'</div>'}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),2500)}function escapeHtml(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.addEventListener('DOMContentLoaded',async()=>{if(!authed()){location.replace('admin.html');return}await loadConfig();await loadDefinicoes()});async function loadDefinicoes(){try{const c=await apiGet('garage.adminConfig');document.getElementById('cfg-nome').value=c.nomeCondominio||'';document.getElementById('cfg-admin-email').value=c.adminEmail||''}catch(e){toast('Erro ao carregar definições')}}async function guardarConfigs(){const configs={NOME_CONDOMINIO:document.getElementById('cfg-nome').value.trim(),ADMIN_EMAIL:document.getElementById('cfg-admin-email').value.trim()};const r=await apiPost('garage.saveConfig',{configs});if(r.ok||r.success){setMsg('cfg-msg','ok','Configurações guardadas.');toast('Guardado')}else setMsg('cfg-msg','err',r.msg||'Erro ao guardar')}async function guardarPinAdmin(){const pin=document.getElementById('cfg-admin-pin').value.trim();if(!/^\d{4,6}$/.test(pin)){setMsg('pin-msg','err','O PIN deve ter 4 a 6 dígitos.');return}const r=await apiPost('garage.saveConfig',{configs:{ADMIN_PIN:pin}});if(r.ok||r.success){document.getElementById('cfg-admin-pin').value='';setMsg('pin-msg','ok','PIN alterado.');toast('PIN alterado')}else setMsg('pin-msg','err',r.msg||'Erro ao alterar')}
</script></body></html>
