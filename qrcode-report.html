<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1A2F5A">
  <title>Reportar extintor</title>
  <style>
    :root{--bg:#F5F7FA;--card:#fff;--navy:#1A2F5A;--blue:#2563EB;--blue-lt:#EFF6FF;--text:#111827;--muted:#6B7280;--border:#E5E7EB;--ok:#16A34A;--warn:#D97706;--danger:#DC2626;--shadow:0 1px 8px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.05)}
    *{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;background:linear-gradient(180deg,#EEF4FF 0%,var(--bg) 56%);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}.app{width:min(100%,520px);margin:0 auto;padding:0 16px 28px}.top{background:var(--navy);color:#fff;margin:0 -16px 0;padding:22px 20px 44px;border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(26,47,90,.16)}.top-row{display:flex;align-items:flex-start;gap:12px}.back{width:40px;height:40px;border:0;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;font-weight:900;text-decoration:none;display:flex;align-items:center;justify-content:center;flex-shrink:0}.title{font-size:24px;font-weight:900;line-height:1.12;margin:0}.sub{font-size:13px;color:rgba(255,255,255,.76);line-height:1.45;margin:6px 0 0}.intro{margin:-22px 0 14px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}.intro-icon{width:54px;height:54px;border-radius:17px;background:#FEE2E2;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}.intro-title{font-size:15px;font-weight:900;color:var(--navy)}.intro-text{font-size:12px;color:var(--muted);line-height:1.42;margin-top:3px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px}.point-title{font-size:18px;font-weight:900;color:var(--navy);margin:0}.point-meta{font-size:13px;color:var(--muted);line-height:1.45;margin-top:6px}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;margin-top:10px}.status:before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}.status.ok{background:#F0FDF4;color:#166534}.status.pending{background:#FFFBEB;color:#92400E}.status.open{background:#FEF2F2;color:#991B1B}.existing{display:grid;gap:5px;margin-top:10px;font-size:13px;color:var(--muted);line-height:1.4}.existing strong{color:var(--text)}.existing a{color:var(--blue);font-weight:900}.field{margin-top:12px}.field label{display:block;margin-bottom:7px;color:var(--navy);font-size:13px;font-weight:900}.input{width:100%;border:1.5px solid var(--border);background:#fff;color:var(--text);border-radius:14px;padding:14px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.10)}textarea.input{min-height:96px;resize:vertical}.photo-box{border:1px dashed #CBD5E1;border-radius:16px;padding:12px;background:#F8FAFC}.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{appearance:none;border:0;border-radius:14px;padding:14px 15px;cursor:pointer;font-weight:900;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}.btn:active{transform:scale(.98)}.btn-primary{background:var(--blue);color:#fff}.btn-navy{background:var(--navy);color:#fff}.btn-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--border)}.btn:disabled{opacity:.58;cursor:not-allowed}.hidden{display:none!important}.photo-meta{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.35;word-break:break-word}.hint{font-size:12px;color:var(--muted);line-height:1.45;margin-top:6px}.msg{padding:12px 13px;border-radius:13px;margin:10px 0 0;font-size:13px;font-weight:800;line-height:1.4}.msg.err{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}.msg.ok{background:#F0FDF4;color:#166534;border:1px solid #BBF7D0}.msg.info{background:var(--blue-lt);color:#1D4ED8;border:1px solid #DBEAFE}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(30px);width:min(calc(100% - 28px),520px);padding:14px 16px;border-radius:16px;background:var(--navy);color:#fff;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:40}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;display:inline-block;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="top-row"><a class="back" href="V2/index.html" aria-label="Voltar">←</a><div><h1 class="title">Reportar extintor</h1><p class="sub">Preencha a inconformidade e confirme com o seu PIN pessoal apenas no envio.</p></div></div></header>
    <section class="intro"><div class="intro-icon">🧯</div><div><div class="intro-title">Reporte por QR code</div><div class="intro-text" id="introText">A carregar o ponto selecionado...</div></div></section>
    <section class="card" id="pointCard"><p class="point-title">A carregar...</p><p class="point-meta">Só um instante.</p></section>
    <form class="card" id="reportForm">
      <div class="field"><label for="reason">Motivo</label><select id="reason" class="input" required><option value="">A carregar...</option></select></div>
      <div class="field"><label for="notes">Observação <span style="color:var(--muted);font-weight:700">(opcional)</span></label><textarea id="notes" class="input" maxlength="500" placeholder="Ex.: extintor em falta, suporte vazio, acesso obstruído..."></textarea></div>
      <div class="field"><label>Fotografia</label><div class="photo-box"><div class="photo-actions"><button class="btn btn-secondary" type="button" id="cameraBtn">Usar câmara</button><button class="btn btn-secondary" type="button" id="fileBtn">Escolher foto</button></div><div class="photo-meta" id="photoMeta">Sem fotografia selecionada.</div><input class="hidden" type="file" id="cameraInput" accept="image/*" capture="environment"><input class="hidden" type="file" id="fileInput" accept="image/*"></div></div>
      <div class="field"><label for="pin">PIN pessoal</label><input id="pin" class="input" type="password" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Introduza o PIN para confirmar"><div class="hint">A registar por: o utilizador associado ao PIN validado no envio.</div></div>
      <div id="msg"></div>
      <button class="btn btn-primary" id="submitBtn" type="submit">Submeter reporte</button>
    </form>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
let CFG=null,POINT=null,FILE=null,EXISTING=null;
const $=id=>document.getElementById(id);
document.addEventListener('DOMContentLoaded',init);
async function init(){try{CFG=await loadConfig();POINT=findPointFromUrl();fillReasons();renderPoint();await loadExisting();bind();}catch(e){console.error(e);$('pointCard').innerHTML='<p class="point-title">Não foi possível abrir o QR code</p><p class="point-meta">'+escapeHtml(e.message||'Erro ao carregar.')+'</p>';}}
function bind(){$('cameraBtn').onclick=()=>$('cameraInput').click();$('fileBtn').onclick=()=>$('fileInput').click();$('cameraInput').onchange=pickPhoto;$('fileInput').onchange=pickPhoto;$('reportForm').onsubmit=submit;}
async function loadConfig(){const r=await fetch('config.json',{cache:'no-store'});if(!r.ok)throw new Error('Configuração não encontrada.');return r.json();}
function findPointFromUrl(){const p=new URLSearchParams(location.search);const floor=Number(p.get('floor'));const point=String(p.get('point')||'').trim().toUpperCase();if(!Number.isFinite(floor)||!point)throw new Error('QR code sem piso ou extintor.');const floors=CFG?.building?.floors||[];for(const f of floors){for(const e of (f.extinguishers||[])){if(Number(f.floor)===floor&&String(e.point).toUpperCase()===point){return {floor:f.floor,floorLabel:floorLabel(f.floor,f.label),point:e.point,label:e.label||e.point,shortLabel:e.shortLabel||e.point,location:e.location||''};}}}throw new Error('O extintor indicado no QR code não foi encontrado.');}
function fillReasons(){const select=$('reason');select.innerHTML='<option value="">Selecionar motivo</option>';const reasons=CFG?.reportReasons||['Extintor em falta','Extintor danificado','Suporte vazio','Selo / verificação em falta','Acesso obstruído','Outro'];reasons.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;select.appendChild(o);});}
function renderPoint(){document.title='Reportar '+POINT.floorLabel+' · '+POINT.label;$('introText').textContent='Ponto pré-selecionado. Basta preencher a anomalia, juntar foto se necessário e validar com PIN no envio.';$('pointCard').innerHTML='<p class="point-title">'+escapeHtml(POINT.floorLabel)+' · '+escapeHtml(POINT.label)+'</p><p class="point-meta">'+escapeHtml(POINT.location||'Sem localização indicada')+'</p><span class="status ok" id="statusBadge">Sem ocorrência conhecida</span><div class="existing" id="existingBox"></div>';}
async function loadExisting(){try{const [open,pending]=await Promise.allSettled([apiGet('openOccurrences'),apiGet('pendingOccurrences')]);const key=makeKey(POINT.floor,POINT.point);const all=[];if(open.status==='fulfilled')asList(open.value).forEach(x=>all.push({type:'open',...x}));if(pending.status==='fulfilled')asList(pending.value).forEach(x=>all.push({type:'pending',...x}));EXISTING=all.find(x=>makeKey(x.floor??x.piso??x.FLOOR,x.point??x.ponto??x.POINT)===key)||null;if(EXISTING)renderExisting(EXISTING);}catch(e){console.warn(e);}}
function renderExisting(o){const type=o.type==='pending'?'pending':'open';const badge=$('statusBadge');badge.className='status '+type;badge.textContent=type==='pending'?'A aguardar validação':'Ocorrência aberta';const box=$('existingBox');box.innerHTML='<div><strong>Já existe '+(type==='pending'?'um reporte a aguardar validação':'uma ocorrência aberta')+' neste extintor.</strong></div>'+(o.reason?'<div><strong>Motivo:</strong> '+escapeHtml(o.reason)+'</div>':'')+(o.notes?'<div><strong>Observação:</strong> '+escapeHtml(o.notes)+'</div>':'')+(o.reportedBy?'<div><strong>Reportado por:</strong> '+escapeHtml(o.reportedBy)+'</div>':'')+(o.photoUrl?'<div><strong>Foto:</strong> <a href="'+escapeHtml(o.photoUrl)+'" target="_blank" rel="noopener noreferrer">Abrir fotografia</a></div>':'');}
function asList(p){if(!p)return[];if(Array.isArray(p))return p;return p.occurrences||p.items||p.data||[];}
function floorLabel(floor,label){const n=Number(floor);if(Number.isFinite(n)&&n>0)return n+'º';return String(label||floor||'');}
function pickPhoto(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Escolha uma imagem válida.');ev.target.value='';return;}if(f.size>18*1024*1024){toast('A fotografia é demasiado grande. Use uma imagem até 18 MB.');ev.target.value='';return;}FILE=f;$('photoMeta').textContent=f.name+' · '+formatBytes(f.size)+' · será reduzida antes do envio';}
async function submit(ev){ev.preventDefault();const reason=$('reason').value;const notes=$('notes').value.trim();const pin=$('pin').value.trim();$('msg').innerHTML='';if(!reason){setMsg('err','Selecione o motivo.');return;}if((CFG?.features?.reportPhotoRequired)&&!FILE){setMsg('err','A fotografia é obrigatória neste reporte.');return;}if(!/^\d{4,6}$/.test(pin)){setMsg('err','Introduza o PIN pessoal para confirmar o reporte.');return;}const btn=$('submitBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> A validar PIN...';try{const login=await apiPost('garage.loginPin',{pin,userAgent:navigator.userAgent});if(!(login.ok||login.success))throw new Error(login.msg||'PIN inválido.');const name=login.nome||'Utilizador autorizado';try{localStorage.setItem('dc4_user',JSON.stringify({nome:name,piso:login.piso||'',fracao:login.fracao||''}));}catch(e){}btn.innerHTML=FILE?'<span class="spinner"></span> A reduzir foto...':'<span class="spinner"></span> A enviar...';const photo=FILE?await fileToPayload(FILE):null;btn.innerHTML='<span class="spinner"></span> A enviar...';const payload={action:'report',floor:Number(POINT.floor),point:POINT.point,location:POINT.location,name,reason,notes,photoBase64:photo?.base64||'',photoDataUrl:photo?.dataUrl||'',photoName:photo?.name||'',photoType:photo?.type||'',clientTs:new Date().toISOString(),source:'github-pages-qr-direct'};const r=await apiPost('report',payload);if(r?.success===false||r?.ok===false)throw new Error(r.message||r.msg||'Falha no registo do reporte.');setMsg('ok','Reporte enviado. Aguarda validação da administração.');toast('Reporte enviado. Obrigado!');$('reportForm').reset();FILE=null;$('photoMeta').textContent='Sem fotografia selecionada.';}catch(e){console.error(e);setMsg('err',e.message||'Não foi possível enviar o reporte.');toast(e.message||'Não foi possível enviar.');}finally{btn.disabled=false;btn.textContent='Submeter reporte';}}
async function apiGet(action){const u=new URL(CFG.backendUrl);u.searchParams.set('action',action);const r=await fetch(u,{cache:'no-store'});return parseJson(r);}
async function apiPost(action,data){const r=await fetch(CFG.backendUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},data||{}))});return parseJson(r);}
async function parseJson(r){const t=await r.text();try{return JSON.parse(t);}catch(e){if(!r.ok)throw new Error('Resposta inválida do backend.');return{ok:true,success:true,raw:t};}}
async function fileToPayload(file){const originalSize=file.size;const compressed=await compressImage(file,{maxWidth:1280,maxHeight:1280,quality:.72,maxBytes:450*1024});return {...compressed,originalSize,base64:(compressed.dataUrl.split(',')[1]||'')};}
async function compressImage(file,opt){if(!/^image\/(jpeg|jpg|png|webp)$/i.test(file.type)){const dataUrl=await readFile(file);return{dataUrl,type:file.type||'image/jpeg',name:file.name||'foto.jpg',size:file.size};}const img=await loadImg(file);let w=img.width,h=img.height;const ratio=Math.min(opt.maxWidth/w,opt.maxHeight/h,1);w=Math.max(1,Math.round(w*ratio));h=Math.max(1,Math.round(h*ratio));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{alpha:false}).drawImage(img,0,0,w,h);let q=opt.quality,d=c.toDataURL('image/jpeg',q),s=estimate(d);while(s>opt.maxBytes&&q>.45){q=Math.max(.45,q-.08);d=c.toDataURL('image/jpeg',q);s=estimate(d);}return{dataUrl:d,type:'image/jpeg',name:String(file.name||'foto').replace(/\.[^.]+$/,'')+'.jpg',size:s};}
function loadImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Não foi possível preparar a fotografia.'))};img.src=url;});}
function readFile(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result));fr.onerror=()=>rej(new Error('Não foi possível ler a fotografia.'));fr.readAsDataURL(file);});}
function estimate(dataUrl){return Math.round((String(dataUrl).split(',')[1]||'').length*.75);}function makeKey(f,p){return Number(f)+':'+String(p||'').trim().toUpperCase();}function escapeHtml(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}function setMsg(type,text){$('msg').innerHTML='<div class="msg '+type+'">'+escapeHtml(text)+'</div>';}function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),3200);}function formatBytes(bytes){const u=['B','KB','MB','GB'];let v=bytes||0,i=0;while(v>=1024&&i<u.length-1){v/=1024;i++;}return v.toFixed(v>=10||i===0?0:1)+' '+u[i];}
</script>
</body>
</html>
